<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
<title>Todo</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="popover.css">
</head>
<body>
  <div class="panel">

    <div class="composer">
      <div class="field">
        <span class="bullet"></span>
        <input id="draft" type="text" placeholder="Neue Aufgabe" autocomplete="off" spellcheck="false">
      </div>
      <div class="composer-options" id="composerOptions" hidden>
        <div class="chips" id="chips"></div>
        <div class="controls">
          <div class="segmented" id="prios"></div>
          <div class="segmented" id="buckets"></div>
        </div>
        <div class="controls">
          <div class="segmented" id="repeats"></div>
          <button class="add" id="add">Hinzufügen</button>
        </div>
      </div>
    </div>

    <div class="today-head">
      <div class="line">
        <span class="title">Heute</span>
        <span class="num muted" id="progressLabel"></span>
      </div>
      <div class="progress" id="progress"><i></i></div>
    </div>

    <div class="list" id="list"></div>

    <div class="footer">
      <span id="openCount"></span>
      <span class="keys">
        <span>⌥ Leertaste</span>
        <button class="link" id="openWindow">Fenster öffnen</button>
      </span>
    </div>

  </div>

<script src="../shared/dates.js"></script>
<script src="../shared/model.js"></script>
<script src="dom.js"></script>
<script src="popover.js"></script>
</body>
</html>
